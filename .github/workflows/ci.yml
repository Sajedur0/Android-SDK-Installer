name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show the PowerShell version
        run: $PSVersionTable | Format-List | Out-String | Write-Host

      - name: Parse every PowerShell file
        run: |
          $failed = @()
          foreach ($file in @(Get-ChildItem -Path $PWD -Recurse -Filter *.ps1 -File)) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              foreach ($error in @($errors)) {
                  $failed += "$($file.Name):$($error.Extent.StartLineNumber): $($error.Message)"
              }
          }
          if ($failed.Count -gt 0) {
              $failed | ForEach-Object { Write-Host "::error::$_" }
              exit 1
          }
          Write-Host 'Every PowerShell file parses cleanly.'

      - name: Run the test suite
        run: |
          $exe = if ($PSVersionTable.PSEdition -eq 'Core') { 'pwsh' } else { 'powershell' }
          & $exe -NoProfile -ExecutionPolicy Bypass -File ./tests/Progress.Tests.ps1
          exit $LASTEXITCODE

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint the installer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path ./Android_SDK.ps1 -Settings ./.github/PSScriptAnalyzerSettings.psd1)
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results.Count -gt 0) {
              throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer found no issues.'

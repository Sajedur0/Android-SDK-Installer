name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    name: Syntax and progress-bar tests
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report the PowerShell versions under test
        shell: pwsh
        run: |
          Write-Host "pwsh   : $($PSVersionTable.PSVersion)"
          $legacy = & powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          Write-Host "powershell : $legacy"

      - name: Test on Windows PowerShell 5.1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Progress.Tests.ps1

      - name: Test on PowerShell 7
        shell: pwsh
        run: ./tests/Progress.Tests.ps1
